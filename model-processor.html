<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Project Strike Asset Processor V11</title>
<style>
html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:99px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1.1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}pre{white-space:pre-wrap;color:#ffaaaa}
</style>
</head>
<body>
<div id="boot"><h2>Project Strike Asset Processor V11</h2><p>Loading model processor…</p><div class="bar"><i></i></div></div>
<script>
(async()=>{
  try{
    const res=await fetch('model-processor-v11.html?entry='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('Could not load V11: HTTP '+res.status);
    let html=await res.text();
    const pinned='https://cdn.jsdelivr.net/gh/matthewcodergamer/RAGE-Weapon-Audio-Web@8eefe9d21afb88e09b7e3315e2f4c5b190571d19/model-processor-v9.html';
    html=html.replaceAll('model-processor-v9.html',pinned);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').innerHTML='<h2>Model processor failed to start</h2><pre>'+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>

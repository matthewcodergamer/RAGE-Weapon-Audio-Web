<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>Project Strike Asset Processor V10</title><style>html,body{margin:0;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui}#boot{padding:24px;max-width:760px;margin:auto}.bar{height:8px;background:#242a33;border-radius:99px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#69adfa;animation:x 1.1s infinite alternate}@keyframes x{to{transform:translateX(185%)}}</style></head><body><div id="boot"><h2>Project Strike Asset Processor V10</h2><p>Loading package-aware model + texture organizer…</p><div class="bar"><i></i></div></div><script>
(async()=>{try{let h=await(await fetch('model-processor-v9.html?v10src=1',{cache:'no-store'})).text();
// Version labels and broader image/dependency formats.
h=h.replaceAll('Project Strike Asset Processor V9','Project Strike Asset Processor V10');
h=h.replace('Fast package expansion with ZIP compatibility fallback → real FBX/GLB processing → verified 3D preview → organized FPS upload.','Package-aware import → textures and reference images matched to their model → real FBX/GLB processing → organized FPS upload.');
h=h.replace("const MODEL=new Set(['fbx','glb','gltf','blend']),IMG=new Set(['png','jpg','jpeg','webp','tga','bmp','ktx2','avif']),DEP=new Set([...IMG,'bin','mtl','obj']);","const MODEL=new Set(['fbx','glb','gltf','blend']),IMG=new Set(['png','jpg','jpeg','webp','tga','bmp','ktx2','avif','gif','tif','tiff','exr','hdr']),DEP=new Set([...IMG,'bin','mtl','obj']);");
const start=h.indexOf('function buildItems(){');const end=h.indexOf('function summary()',start);if(start<0||end<0)throw Error('Could not patch asset discovery');
const replacement=`function textureRole(n){const x=n.toLowerCase();if(/base.?color|basecolor|albedo|diffuse|_diff\\b|_d\\b/.test(x))return'Base Color';if(/normal|_nor\\b|_nrm\\b/.test(x))return'Normal';if(/rough|roughness/.test(x))return'Roughness';if(/metal|metallic/.test(x))return'Metallic';if(/ambient.?occlusion|occlusion|_ao\\b/.test(x))return'AO';if(/(^|[_\\-.])(orm|arm)([_\\-.]|$)/.test(x))return'ORM / ARM';if(/height|displace|displacement/.test(x))return'Height / Displacement';if(/emissive|emission|glow/.test(x))return'Emissive';if(/opacity|alpha|transparen/.test(x))return'Opacity / Alpha';if(/specular|spec\\b/.test(x))return'Specular';if(/thumbnail|preview|render|reference|ref\\b|cover/.test(x))return'Reference Image';return'Image / Texture'}function packageRoot(p){const a=p.replaceAll('\\\\','/').split('/').filter(Boolean);if(a.length<=1)return clean(stem(a[0]||'asset'));const tex=a.findIndex(x=>/^textures?$/i.test(x));if(tex>0)return clean(a[tex-1]);return clean(a[0])}function ownerFor(path,owners){const d=dirname(path).toLowerCase(),root=packageRoot(path);let best=null,score=-1;for(const o of owners){const od=dirname(o.path).toLowerCase();let s=packageRoot(o.path)===root?100:0;if(od&&d.startsWith(od))s+=od.length;if(s>score){score=s;best=o}}return score>0?best:null}function buildItems(){S.items=[];const owners=[];for(const[path,file]of S.files){if(junk(path,file.size))continue;const e=ext(path);if(e==='blend'){const x={type:'blend',kind:e,path,name:base(path),sourceName:base(path),file,status:'source',category:classify(path),runtime:null,error:'',packageId:packageRoot(path)};S.items.push(x);owners.push(x)}else if(['fbx','glb','gltf'].includes(e)){const a=isAnim(path),x={type:a?'animation':'model',kind:e,path,name:base(path),sourceName:base(path),file,status:'pending',category:classify(path,a),runtime:null,error:'',packageId:packageRoot(path)};S.items.push(x);if(!a)owners.push(x)}}for(const[path,file]of S.files){if(junk(path,file.size))continue;const e=ext(path);if(!DEP.has(e)||['fbx','glb','gltf','blend'].includes(e))continue;const owner=ownerFor(path,owners),role=IMG.has(e)?textureRole(path):e.toUpperCase(),pkg=owner?.packageId||packageRoot(path);S.items.push({type:'dependency',kind:e,path,name:base(path)+' · '+role,sourceName:base(path),file,status:'dependency',category:owner?.category||'',runtime:null,error:'',ownerPath:owner?.path||'',packageId:pkg,role});log(\`Assigned \${base(path)} → \${owner?owner.name:pkg} · \${role}\`,'good')}render();summary();log(\`Discovery: \${S.items.filter(i=>i.type==='model').length} models, \${S.items.filter(i=>i.type==='animation').length} animations, \${S.items.filter(i=>i.type==='dependency').length} images/dependencies, \${S.items.filter(i=>i.type==='blend').length} Blender sources\`,'good')}`;
h=h.slice(0,start)+replacement+h.slice(end);
// Make dependency cards visibly show their package assignment and texture role.
h=h.replace("<div class=\"meta\">${i.type.toUpperCase()} · ${i.kind.toUpperCase()} · ${bytes(i.file.size)}${i.rep?` · ${i.rep.meshes} meshes · ${i.rep.triangles.toLocaleString()} tris · ${i.rep.animations} anim`:''}</div>","<div class=\"meta\">${i.type.toUpperCase()} · ${i.kind.toUpperCase()} · ${bytes(i.file.size)}${i.rep?` · ${i.rep.meshes} meshes · ${i.rep.triangles.toLocaleString()} tris · ${i.rep.animations} anim`:''}${i.packageId?` · package: ${i.packageId}`:''}${i.role?` · ${i.role}`:''}</div>");
// Replace uploader: runtime assets stay public; textures/dependencies and Blender sources are preserved together under assets-source/imports/<package>/.
const us=h.indexOf('async function uploadAll(){');const ue=h.indexOf('function clearAll()',us);if(us<0||ue<0)throw Error('Could not patch uploader');
const uploader=`async function uploadAll(){const t=$('#token').value.trim(),repo=$('#repo').value.trim(),branch=$('#branch').value.trim();if(!t)return setStatus('Enter your GitHub token.','bad');const runtime=S.items.filter(i=>i.status==='ready'&&i.runtime),support=S.items.filter(i=>i.type==='dependency'||i.type==='blend');const jobs=[];for(const i of runtime)jobs.push({item:i,path:\`public/game-assets/\${i.category}/\${clean(stem(i.sourceName||i.name))}.glb\`,blob:i.runtime});for(const i of support){const pkg=clean(i.packageId||'unassigned'),rel=i.path.replaceAll('\\\\','/');let tail=rel;const parts=rel.split('/');const rootIndex=parts.findIndex(x=>clean(x)===pkg);if(rootIndex>=0)tail=parts.slice(rootIndex+1).join('/')||i.sourceName||base(rel);else tail=i.sourceName||base(rel);const folder=i.type==='blend'?'source':'dependencies';jobs.push({item:i,path:\`assets-source/imports/\${pkg}/\${folder}/\${tail.split('/').map(clean).join('/')}\`,blob:i.file})}S.busy=true;let done=0,failed=0;for(let n=0;n<jobs.length;n++){const j=jobs[n];phase(\`Uploading \${n+1}/\${jobs.length}: \${j.item.sourceName||j.item.name}\`,true);progress(n/jobs.length*100,j.path);try{await put(repo,branch,j.path,j.blob,t);done++;log(\`Uploaded \${j.path}\`,'good')}catch(e){failed++;log(\`UPLOAD FAILED \${j.path}: \${e.message||e}\`,'error');await sleep(180)}}S.busy=false;progress(100,\`Upload complete · \${done} files · \${failed} failed\`);setStatus(failed?\`Upload finished with \${failed} failure(s). Successful files were kept.\`:\`Upload complete. \${done} files organized and synced.\`,failed?'bad':'good');phase('Upload pass finished',false);summary()}`;
h=h.slice(0,us)+uploader+h.slice(ue);
// Better upload button wording.
h=h.replace('Upload Ready Assets','Upload Organized Asset Packages');
document.open();document.write(h);document.close();}catch(e){document.getElementById('boot').innerHTML='<h2>V10 failed to start</h2><pre style="white-space:pre-wrap;color:#ffaaaa">'+String(e)+'</pre>';}})();
</script></body></html>
